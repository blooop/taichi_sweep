[project]
name = "taichi_sweep"
version = "0.1.1"
authors = [{ name = "Austin Gregg-Smith", email = "blooop@gmail.com" }]
description = "A package for taichi parameter sweeps"
readme = "README.md"

dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "==3.10"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
# [tool.pixi.feature.py311.dependencies]
# python = "3.11.*"

[tool.pixi.pypi-dependencies]
taichi_sweep = { path = ".", editable = true }
numpy=">=1.2,<=1.26.2"
holobench="==1.26.3"
# holobench={git = "https://github.com/dyson-ai/bencher.git"}
taichi= "*"
vedo ="*"
pyvista="*"


[project.optional-dependencies]
test = [
  "pytest-cov>=4.1,<=5.0.0",
  "pytest>=7.4,<=8.2.2",
  "hypothesis>=6.82,<=6.103.2",
  "ruff==0.4.9",
  "coverage>=7.2.7,<=7.5.3",
]

[project.urls]
Source = "https://github.com/blooop/taichi_sweep"
Home = "https://github.com/blooop/taichi_sweep"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include= ["taichi_sweep"]

# Environments
[tool.pixi.environments]
default = {features = ["test"], solve-group = "default" }
py310 = ["py310","test"]
# py311 = ["py311","test"]

[tool.pixi.tasks]
format = "ruff format ."
check-clean-workspace = "git diff --exit-code"
ruff-lint = "ruff check . --fix"
lint = { depends-on = ["ruff-lint"] }
style = { depends-on = ["format","lint"]}
commit-format = "git commit -a -m'autoformat code'"
test = "pytest"
coverage = "coverage run -m pytest && coverage xml -o coverage.xml"
coverage-report = "coverage report -m"
update-lock = "pixi update && git commit -a -m'update pixi.lock'"
push = "git push"
update-lock-push = { depends-on = ["update-lock", "push"] }
ci-no-cover = { depends-on = ["style", "test"] }
ci = { depends-on = ["format","ruff-lint","check-clean-workspace", "coverage", "coverage-report"] }
ci-push = {depends-on=["format","ruff-lint","update-lock","ci","push"]}
clear-pixi = "rm -rf .pixi pixi.lock"
setup-git-merge-driver = "git config merge.ourslock.driver true"
update-from-template-repo = "./scripts/update_from_template.sh"



[tool.ruff]
line-length = 100

target-version = "py310"

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
#"F841" will auto remove unused variables which is annoying during development
ignore = ["E501", "E902", "F841"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]


[tool.coverage.run]
omit = ["*/test/*", "__init__.py"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if False:",
  "if 0:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "pass",
  "(_):",
]
